<!DOCTYPE html>
<html>
<head>
<title>My AI</title>
<style>
body { font-family: sans-serif; background: #111; color: #eee; padding: 20px; }
#chat { min-height: 200px; border: 1px solid #444; padding: 10px; margin-bottom: 10px; }
input { width: 70%; padding: 10px; }
button { padding: 10px; }
</style>
</head>
<body>
<h2>My AI Assistant</h2>
<div id="chat"></div>
<input id="userInput" placeholder="Type here...">
<button onclick="sendMessage()">Send</button>
<button onclick="startListening()">🎤</button>

<script>
const API_KEY = "YOUR_GROQ_KEY_HERE";

async function sendMessage() {
  const input = document.getElementById("userInput");
  const text = input.value;
  if (!text) return;
  addMessage("You: " + text);
  input.value = "";

  const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + API_KEY
    },
    body: JSON.stringify({
      model: "llama-3.3-70b-versatile",
      messages: [{ role: "user", content: text }]
    })
  });

  const data = await response.json();
  const reply = data.choices[0].message.content;
  addMessage("AI: " + reply);
  speak(reply);
}

function addMessage(msg) {
  document.getElementById("chat").innerHTML += "<p>" + msg + "</p>";
}

function speak(text) {
  const utter = new SpeechSynthesisUtterance(text);
  speechSynthesis.speak(utter);
}

function startListening() {
  const recognition = new webkitSpeechRecognition();
  recognition.onresult = function(event) {
    document.getElementById("userInput").value = event.results[0][0].transcript;
    sendMessage();
  };
  recognition.start();
}
</script>
</body>
</html>
