<!DOCTYPE html>
<html>
<head>
<title>CEO AI</title>
<style>
body { margin:0; background:#000; color:#fff; font-family:sans-serif; text-align:center; }
.logo { font-weight:bold; font-size:24px; padding:20px; text-align:left; }
h1 { font-size:48px; margin:10px 0 0; }
p { color:#aaa; margin:5px 0; }
.circle {
  width:220px; height:220px; border-radius:50%;
  border:2px solid #fff; margin:40px auto;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 40px rgba(255,255,255,0.3);
}
.mic {
  width:70px; height:70px; border-radius:50%;
  background:#222; border:none; color:#fff; font-size:28px;
  margin-top:20px;
}
#chat { color:#ccc; min-height:40px; padding:0 20px; }
.inputRow {
  display:flex; margin:30px 20px;
  background:#111; border-radius:30px; padding:10px 15px;
}
input { flex:1; background:none; border:none; color:#fff; font-size:16px; outline:none; }
button.send { background:none; border:none; color:#fff; font-size:20px; }
</style>
</head>
<body>
<div class="logo">CEO</div>
<h1>Hello.</h1>
<p>I'm CEO AI.</p>
<p>How can I help you today?</p>

<div class="circle"><div id="chat"></div></div>
<button class="mic" onclick="startListening()">🎤</button>

<div class="inputRow">
  <input id="userInput" placeholder="Message CEO AI...">
  <button class="send" onclick="sendMessage()">➤</button>
</div>

<script>
const API_KEY = "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";

async function sendMessage() {
  const input = document.getElementById("userInput");
  const text = input.value;
  if (!text) return;
  input.value = "";
  document.getElementById("chat").innerText = "...";

  const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + API_KEY
    },
    body: JSON.stringify({
      model: "llama-3.3-70b-versatile",
      messages: [{ role: "user", content: text }]
    })
  });

  const data = await response.json();
  const reply = data.choices[0].message.content;
  document.getElementById("chat").innerText = reply;
  speak(reply);
}

function speak(text) {
  const utter = new SpeechSynthesisUtterance(text);
  speechSynthesis.speak(utter);
}

function startListening() {
  const recognition = new webkitSpeechRecognition();
  recognition.onresult = function(event) {
    document.getElementById("userInput").value = event.results[0][0].transcript;
    sendMessage();
  };
  recognition.start();
}
</script>
</body>
</html>
